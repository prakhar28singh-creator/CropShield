<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1560" font-family="Inter,Segoe UI,Arial,sans-serif">
<style>
.t{font-weight:800;fill:#0b2415}.s{fill:#3d5345}.tag{font-size:12px;font-weight:800;letter-spacing:.1em}
.box{fill:#ffffff;stroke:#cfe0cd;stroke-width:1.5;rx:16}.acc{fill:#16a34a}.pill{fill:#f2f7ef;stroke:#d7e5d3}
.engA{stroke:#16a34a}.engB{stroke:#0ea5e9}.engC{stroke:#f59e0b}
.num{fill:#0b2415;font-weight:800}.nbg{fill:#a3e635;stroke:#0b2415}
.flow{stroke:#166534;stroke-width:2.2;fill:none}.opt{stroke:#9aa8a0;stroke-width:2;stroke-dasharray:7 6;fill:none}
</style>
<rect width="1600" height="1560" fill="#f7faf6"/>
<!-- Header -->
<rect x="0" y="0" width="1600" height="84" fill="#ffffff" stroke="#e1eae0"/>
<rect x="0" y="80" width="1600" height="4" fill="#16a34a"/>
<text x="60" y="36" font-size="26" class="t">🌾 CropShield AI — System Architecture (Hackathon MVP)</text>
<text x="60" y="60" font-size="13.5" class="s">Smart Post-Harvest Loss Prevention &amp; Price Protection • Tomato-first, extensible to other crops • Light, explainable, demo-honest</text>
<rect x="1230" y="20" width="310" height="44" rx="22" fill="#ecfccb" stroke="#a3e635"/><text x="1385" y="47" text-anchor="middle" font-size="12.5" font-weight="800" fill="#365314">✔ MVP-FEASIBLE • NO K8s • NO HW</text>
<!-- L1 -->
<text x="60" y="112" class="tag" fill="#16a34a">LAYER 1 — USER INTERFACE • REACT + CSS + JS</text>
<rect x="60" y="120" width="1480" height="132" rx="16" class="box"/>
<text x="84" y="148" font-size="15" class="t">💻 Frontend (HTTPS • JSON) — Public homepage + Guest price lookup + Auth + Batch form + Risk screen + Market dashboard + History</text>
<g font-size="12" font-weight="700" fill="#1f3527">
<rect x="84" y="160" width="200" height="30" rx="15" class="pill"/><text x="184" y="179" text-anchor="middle">🏠 Public Homepage</text>
<rect x="292" y="160" width="218" height="30" rx="15" class="pill"/><text x="401" y="179" text-anchor="middle">🔍 Mandi Lookup (Guest)</text>
<rect x="518" y="160" width="198" height="30" rx="15" class="pill"/><text x="617" y="179" text-anchor="middle">👩‍🌾 Login / Register</text>
<rect x="724" y="160" width="190" height="30" rx="15" class="pill"/><text x="819" y="179" text-anchor="middle">📝 Batch Form</text>
<rect x="922" y="160" width="186" height="30" rx="15" class="pill"/><text x="1015" y="179" text-anchor="middle">🔬 Risk Screen</text>
<rect x="1116" y="160" width="200" height="30" rx="15" class="pill"/><text x="1216" y="179" text-anchor="middle">📊 Market Compare</text>
<rect x="1324" y="160" width="168" height="30" rx="15" class="pill"/><text x="1408" y="179" text-anchor="middle">🧾 History</text>
</g>
<text x="84" y="218" font-size="12.5" class="s">Inputs: crop • quantity (e.g. 500 kg tomato) • harvest date • village/district • storage method • temp / humidity (if known) • planned storage days</text>
<text x="84" y="238" font-size="12" font-weight="700" fill="#15803d">Guest = prices + one-time assessment (no save) | Registered = save batches + history</text>
<!-- L2 -->
<text x="60" y="280" class="tag" fill="#15803d">LAYER 2 — BACKEND API • PYTHON + FASTAPI (CENTRAL HUB)</text>
<rect x="60" y="288" width="1480" height="118" rx="16" class="box" stroke="#16a34a" stroke-width="2"/>
<rect x="76" y="304" width="640" height="86" rx="12" fill="#0b2415"/>
<text x="96" y="330" font-size="15" font-weight="800" fill="#a3e635">⚙ FastAPI — HTTPS / JSON entry point</text>
<text x="96" y="350" font-size="12.5" fill="#d9e8d5">Validate + preprocess • Auth (JWT) • Route to engines • Fuse results • Structured JSON out</text>
<text x="96" y="368" font-size="12" fill="#9dc49a">POST /assess • GET /prices • /batches • /history • Keys stay on server</text>
<g font-size="12" font-weight="700" fill="#1f3527">
<rect x="728" y="304" width="182" height="38" rx="10" fill="#ecfccb" stroke="#16a34a"/><text x="819" y="328" text-anchor="middle">✔ Validate input</text>
<rect x="918" y="304" width="182" height="38" rx="10" fill="#ecfccb" stroke="#16a34a"/><text x="1009" y="328" text-anchor="middle">🔐 Authenticate</text>
<rect x="1108" y="304" width="182" height="38" rx="10" fill="#ecfccb" stroke="#16a34a"/><text x="1199" y="328" text-anchor="middle">🔀 Route / Fuse</text>
<rect x="728" y="350" width="372" height="38" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="914" y="374" text-anchor="middle">📦 Return JSON: risk + prices + net returns</text>
<rect x="1108" y="350" width="182" height="38" rx="10" fill="#f0fdf4" stroke="#16a34a"/><text x="1199" y="374" text-anchor="middle">💾 Save (opt-in)</text>
</g>
<text x="60" y="434" class="tag" fill="#0f766e">LAYER 3 — CORE PROCESSING SERVICES (INDEPENDENT MODULES)</text>
<rect x="60" y="442" width="1480" height="320" rx="16" class="box"/>
<rect x="76" y="458" width="460" height="288" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="96" y="484" font-size="14.5" class="t">A. Crop Risk Engine</text>
<text x="96" y="502" font-size="11.5" font-weight="800" fill="#15803d">RULE-BASED TODAY · ML LATER (validated)</text>
<text x="96" y="524" font-size="12.5" class="s">- Tomato rules: temp / humidity /</text>
<text x="96" y="540" font-size="12.5" class="s">  method / storage-days</text>
<text x="96" y="560" font-size="12.5" class="s">- Output: LOW / MED / HIGH +</text>
<text x="96" y="576" font-size="12.5" class="s">  reasons + storage guidance</text>
<text x="96" y="596" font-size="12.5" class="s">- Honest: no AI prediction claim</text>
<text x="96" y="612" font-size="12.5" class="s">  until model + data validated</text>
<rect x="96" y="624" width="420" height="34" rx="9" fill="#16a34a"/><text x="306" y="646" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">Ex: 500 kg + heat -&gt; HIGH risk</text>
<rect x="552" y="458" width="460" height="288" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
<text x="572" y="484" font-size="14.5" class="t">B. Market Data Service</text>
<text x="572" y="502" font-size="11.5" font-weight="800" fill="#0284c7">AGMARKNET / data.gov.in (IF LIVE)</text>
<text x="572" y="524" font-size="12.5" class="s">- Fields: market · crop · date ·</text>
<text x="572" y="540" font-size="12.5" class="s">  modal / min / max price</text>
<text x="572" y="560" font-size="12.5" class="s">- Fallback if missing / stale;</text>
<text x="572" y="576" font-size="12.5" class="s">  cache + timestamp shown</text>
<text x="572" y="596" font-size="12.5" class="s">- Demo data labelled SAMPLE —</text>
<text x="572" y="612" font-size="12.5" class="s">  not live, judges can verify</text>
<rect x="572" y="624" width="420" height="34" rx="9" fill="#0ea5e9"/><text x="782" y="646" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">Ex: Nashik Rs 1,850/q · stamped</text>

<rect x="1028" y="458" width="496" height="288" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
<text x="1048" y="484" font-size="14.5" class="t">C. Decision + Recommendation Engine</text>
<text x="1048" y="502" font-size="11.5" font-weight="800" fill="#b45309">FUSES A + B · EXPLAINABLE MATH</text>
<text x="1048" y="524" font-size="12.5" class="s">- Options: sell now · store + sell later ·</text>
<text x="1048" y="540" font-size="12.5" class="s">  sell at another mandi</text>
<text x="1048" y="560" font-size="12.5" class="s">- Net return = price x qty − loss −</text>
<text x="1048" y="576" font-size="12.5" class="s">  storage − transport (assumptions shown)</text>
<text x="60" y="792" class="tag" fill="#6b5d3f">LAYER 4 + 5 — STORAGE (SQLite/Mongo) · EXTERNAL (BACKEND-ONLY)</text>
<rect x="60" y="800" width="900" height="200" rx="16" fill="#ffffff" stroke="#cfe0cd" stroke-width="1.5"/>
<text x="84" y="828" font-size="14.5" class="t">Storage — passive store, never analyses</text>
<text x="84" y="852" font-size="12.5" class="s">users + auth · crop batches · risk results · price snapshots + time · recommendations + history</text>
<text x="84" y="872" font-size="12.5" class="s">Tables: users · batches · assessments · prices_cache · recommendations</text>
<rect x="84" y="884" width="420" height="32" rx="9" fill="#ecfccb" stroke="#16a34a"/><text x="294" y="905" text-anchor="middle" font-size="12" font-weight="800" fill="#1f3527">save needs login · guest = no save</text>
<text x="84" y="940" font-size="12" font-weight="800" fill="#15803d">Backend reads/writes via ORM · DB never calls engines or internet</text>
<rect x="976" y="800" width="564" height="200" rx="16" fill="#fff7ed" stroke="#e5c07b" stroke-width="1.5"/>
<text x="1000" y="828" font-size="14.5" class="t">External — backend-only, keys on server</text>
<text x="1000" y="852" font-size="12.5" class="s">1) Mandi prices: AGMARKNET / data.gov.in (solid arrow)</text>
<text x="1000" y="872" font-size="12.5" class="s">2) Weather API — OPTIONAL context only (dashed)</text>
<text x="1000" y="892" font-size="12.5" class="s">3) Storage reference table — OPTIONAL (dashed)</text>
<text x="1000" y="914" font-size="12" font-weight="800" fill="#b45309">Never browser-direct · Weather never replaces sensor readings</text>
<rect x="1000" y="924" width="516" height="46" rx="9" fill="#ffffff" stroke="#e5c07b"/><text x="1258" y="945" text-anchor="middle" font-size="12" font-weight="700" fill="#7c4a12">If API down: cached / SAMPLE-labelled fallback + timestamp</text>
<text x="60" y="1028" class="tag" fill="#365314">LAYER 6 — OUTPUT · FARMER DASHBOARD (WHAT THE JUDGE SEES)</text>
<rect x="60" y="1036" width="1480" height="150" rx="16" fill="#0b2415"/>
<text x="90" y="1066" font-size="12.5" font-weight="700" fill="#ecfccb">Risk badge (LOW/MED/HIGH) + reasons + tomato storage tips</text>
<text x="90" y="1090" font-size="12.5" font-weight="700" fill="#ecfccb">Live mandi prices + timestamp + market compare + net-return table</text>
<text x="90" y="1114" font-size="12.5" font-weight="700" fill="#ecfccb">Recommended action + plain why + assumptions + saved history (login)</text>
<rect x="90" y="1124" width="1420" height="46" rx="10" fill="#a3e635"/><text x="800" y="1152" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0b2415">Demo: 500 kg tomato, heat + open heap + 6 days = HIGH; Nashik Rs 1,850/q; SELL NOW ~Rs 8,200 vs store-7d ~Rs 6,900; save if registered</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#166534"/></marker><marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#9aa8a0"/></marker></defs>
<path class="flow" marker-end="url(#ah)" d="M300,252 L300,288"/>
<path class="flow" marker-end="url(#ah)" d="M500,406 L500,458"/>
<path class="flow" marker-end="url(#ah)" d="M800,406 L800,442"/>
<path class="flow" marker-end="url(#ah)" d="M1100,406 L1100,458"/>
<path class="flow" marker-end="url(#ah)" d="M1258,762 L1258,800"/>
<path class="flow" marker-end="url(#ah)" d="M460,1000 L460,1036"/>
<path class="flow" marker-end="url(#ah)" d="M800,762 L800,1036"/>
<path class="opt" marker-end="url(#ah2)" d="M1400,1000 C1400,900 1400,850 1350,700 L1250,500"/>
<path class="opt" marker-end="url(#ah2)" d="M1470,1000 C1470,920 1450,850 1400,750"/>
<text x="60" y="1214" class="tag" fill="#0b2415">END-TO-END DATA FLOW (500 KG TOMATO) — SOLID = PRIMARY · DASHED = OPTIONAL</text>
<rect x="60" y="1222" width="1480" height="150" rx="16" fill="#ffffff" stroke="#cfe0cd"/>
<text x="84" y="1248" font-size="12.5" fill="#1f3527"><tspan class="num">1 </tspan>Farmer enters 500 kg tomato + date + location + storage + temp/humidity + days.</text>
<text x="84" y="1268" font-size="12.5" fill="#1f3527"><tspan class="num">2 </tspan>Frontend POST /assess (HTTPS/JSON); FastAPI validates + auth-checks.</text>
<text x="84" y="1288" font-size="12.5" fill="#1f3527"><tspan class="num">3 </tspan>Risk Engine: LOW/MED/HIGH + reasons + tips. <tspan class="num">4 </tspan>Market Service: mandi prices, live or SAMPLE-labelled.</text>
<text x="84" y="1308" font-size="12.5" fill="#1f3527"><tspan class="num">5 </tspan>Decision Engine: net = price x qty - loss - storage - transport per option. <tspan class="num">6-7 </tspan>JSON back; dashboard renders.</text>
<text x="84" y="1328" font-size="12.5" fill="#1f3527"><tspan class="num">8 </tspan>Registered + Save: backend stores batch + results; history. Guests end at 7.</text>
<text x="84" y="1350" font-size="12" font-weight="800" fill="#15803d">Solid arrows = steps 1-8. Dashed = weather / reference table, backend-only.</text>
<text x="60" y="1400" class="tag" fill="#0b2415">TECH LEGEND + WHY IT WINS</text>
<rect x="60" y="1408" width="740" height="120" rx="14" fill="#ffffff" stroke="#cfe0cd"/>
<text x="84" y="1434" font-size="12.5" fill="#1f3527"><tspan font-weight="800">React/CSS/JS: </tspan>fast form + dashboard; guest vs login views.</text>
<text x="84" y="1454" font-size="12.5" fill="#1f3527"><tspan font-weight="800">FastAPI: </tspan>honest hub — validate, route, fuse, timestamp, hide keys.</text>
<text x="84" y="1474" font-size="12.5" fill="#1f3527"><tspan font-weight="800">3 engines: </tspan>Risk (rules now, ML later) · Prices (live-or-labelled) · Decision (Rs math).</text>
<text x="84" y="1494" font-size="12.5" fill="#1f3527"><tspan font-weight="800">SQLite/Mongo: </tspan>passive store — users, batches, snapshots, history.</text>
<rect x="816" y="1408" width="724" height="120" rx="14" fill="#ecfccb" stroke="#a3e635"/>
<text x="840" y="1434" font-size="13" font-weight="800" fill="#0b2415">Judge line (20 sec): heat + days + method = HIGH stops wait-and-hope;</text>
<text x="840" y="1454" font-size="12.5" fill="#1f3527">timestamped mandi compare + net-return math picks SELL NOW vs STORE</text>
</svg>
