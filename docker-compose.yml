services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      ENABLE_API_DOCS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CROPSHIELD_DB_PATH: /data/cropshield.db
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - cropshield_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  cropshield_data:
